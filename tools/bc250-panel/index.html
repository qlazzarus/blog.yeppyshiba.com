<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BC250 패널 비교</title><style>body{margin:0;background:#101827;color:#edf2ff;font:15px system-ui}header{padding:16px 22px;background:#1c293d}h1{font-size:19px;margin:0 0 8px}p{margin:5px 0;color:#c3cee0}main{display:flex;height:calc(100vh - 150px);min-height:400px}.pane{width:50%;position:relative;border-right:1px solid #536074}.label{position:absolute;top:12px;left:14px;z-index:2;background:#162236dd;padding:8px 12px;border-radius:6px}canvas{width:100%;height:100%;display:block}a,button{color:#aee2ff}button{background:#263b55;border:1px solid #5c7592;border-radius:5px;padding:6px 10px;cursor:pointer}footer{padding:12px 22px} @media(max-width:700px){main{height:75vh;flex-direction:column}.pane{width:100%;height:50%}}</style></head><body><header><h1>BC250 패널 · 원본 / 확장 비교</h1><p>드래그 회전 · 휠 확대/축소 · 오른쪽 드래그 이동 &nbsp;|&nbsp; <button id="reset">정면으로 초기화</button> &nbsp; <a href="/tools/bc250-panel/extended.stl" download>확장 STL 다운로드</a></p><p>ATX와 아래쪽 BC250 사이 +80mm · BC250 아래 바깥쪽 채움 +70mm</p></header><main><div class="pane" id="before"><div class="label">원본 · 150.60 × 123.60 mm</div></div><div class="pane" id="after"><div class="label">확장 · 150.60 × 273.60 mm</div></div></main><footer>회색은 원본과 동일한 형상이며, 슬롯 사이 연장부와 바깥쪽 테두리를 확인하세요. 실제 장착 전 구멍 위치와 출력 방향을 확인하세요.</footer><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {OrbitControls} from '/node_modules/three/examples/jsm/controls/OrbitControls.js';
import {STLLoader} from '/node_modules/three/examples/jsm/loaders/STLLoader.js';
const scenes=[];
function make(id,url){const el=document.getElementById(id), scene=new THREE.Scene();scene.background=new THREE.Color(0x101827);const camera=new THREE.PerspectiveCamera(35,1,.1,5000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));el.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x52617e,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(200,200,300);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const obj={el,scene,camera,renderer,controls};scenes.push(obj);new STLLoader().load(url+'?t='+Date.now(),g=>{g.computeVertexNormals();g.computeBoundingBox();const size=new THREE.Vector3(),center=new THREE.Vector3();g.boundingBox.getSize(size);g.boundingBox.getCenter(center);g.translate(-center.x,-center.y,-center.z);const mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xb6c8dc,roughness:.6,side:THREE.DoubleSide}));scene.add(mesh);obj.distance=Math.max(size.y,size.z)*1.8;reset(obj)},undefined,e=>{el.querySelector('.label').textContent='STL 로드 실패: '+e.message});}
function reset(o){o.controls.target.set(0,0,0);o.camera.up.set(0,1,0);o.camera.position.set(o.distance,0,0);o.controls.update()}
make('before','/Bc250_Ikea_Open_Frame_case_-_Back_Panel.stl');make('after','/tools/bc250-panel/extended.stl');document.getElementById('reset').onclick=()=>scenes.forEach(reset);
function frame(){requestAnimationFrame(frame);for(const o of scenes){const w=o.el.clientWidth,h=o.el.clientHeight;if(o.renderer.domElement.width!==Math.floor(w*o.renderer.getPixelRatio())||o.renderer.domElement.height!==Math.floor(h*o.renderer.getPixelRatio())){o.renderer.setSize(w,h,false);o.camera.aspect=w/h;o.camera.updateProjectionMatrix()}o.controls.update();o.renderer.render(o.scene,o.camera)}}frame();
</script></body></html>
